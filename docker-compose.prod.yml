# ============================================================
# ClinicFlow — Production Portainer Stack
# Deploy on: Oracle A1Flex VPS (ARM64) + Cloudflare Tunnel
# Target domain: demoerp.clinicflow.vet
#
# HOW TO USE:
#   1. In Portainer → Stacks → Add Stack.
#   2. Choose "Repository" under Build Method.
#   3. Enter your repository URL (public, or private with credentials).
#   4. Set target compose file to: docker-compose.prod.yml
#   5. Fill in the environment variables:
#      - DB_PASSWORD (strong password for postgres)
#      - MASTER_PASSWORD (admin master password for database manager)
#   6. Deploy the stack.
#   7. In Cloudflare Zero Trust (Tunnels), add a Public Hostname
#      routing demoerp.clinicflow.vet to http://odoo_clinicflow_prod:8069.
# ============================================================

services:

  # ----------------------------------------------------------
  # Odoo Init & Migration (runs once before main Odoo service)
  # ----------------------------------------------------------
  odoo_init:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinicflow-odoo-prod:latest
    container_name: odoo_clinicflow_init
    restart: "no"
    entrypoint: ["python3", "-c"]
    command:
      - |
        import os
        import sys
        import time
        import subprocess
        import psycopg2

        print("=== Starting ClinicFlow Database Initialization/Upgrade (Inline) ===")

        db_host = os.environ.get("HOST", "postgres_clinicflow")
        db_user = os.environ.get("USER", "odoo")
        db_password = os.environ.get("PASSWORD")
        db_name = "clinicflow"

        # Wait for Postgres
        print(f"Waiting for postgres host {db_host} to be ready...")
        connected = False
        for i in range(30):
            try:
                conn = psycopg2.connect(
                    host=db_host,
                    database=db_name,
                    user=db_user,
                    password=db_password
                )
                conn.close()
                connected = True
                break
            except Exception as e:
                print(f"Postgres not ready yet ({e}). Retrying in 2 seconds...")
                time.sleep(2)

        if not connected:
            print("Error: Postgres connection timed out.")
            sys.exit(1)

        print("Postgres is ready. Checking database state...")

        # Check if custom modules are installed
        db_initialized = False
        custom_modules_installed = False
        try:
            conn = psycopg2.connect(
                host=db_host,
                database=db_name,
                user=db_user,
                password=db_password
            )
            cur = conn.cursor()
            # Check if Odoo base registry table exists
            cur.execute("SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'ir_module_module');")
            db_initialized = cur.fetchone()[0]
            
            if db_initialized:
                # Check if clinicflow_core module is installed
                cur.execute("SELECT EXISTS (SELECT 1 FROM ir_module_module WHERE name = 'clinicflow_core' AND state = 'installed');")
                custom_modules_installed = cur.fetchone()[0]
                
            cur.close()
            conn.close()
        except Exception as e:
            print(f"Error checking database tables: {e}")

        modules = "clinicflow_core,clinicflow_patient,clinicflow_clinical,clinicflow_billing,clinicflow_ai,clinicflow_outreach,base_accounting_kit"

        env = os.environ.copy()

        if custom_modules_installed:
            print("ClinicFlow modules are already installed. Upgrading modules...")
            cmd = [
                "odoo",
                "-d", db_name,
                "-u", modules,
                "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/base_accounting_kit",
                "--db_host=" + db_host,
                "--db_port=5432",
                "--db_user=" + db_user,
                "--db_password=" + db_password,
                "--stop-after-init"
            ]
        else:
            print("ClinicFlow modules are not installed yet. Installing ClinicFlow modules...")
            cmd = [
                "odoo",
                "-d", db_name,
                "-i", modules,
                "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/base_accounting_kit",
                "--db_host=" + db_host,
                "--db_port=5432",
                "--db_user=" + db_user,
                "--db_password=" + db_password,
                "--stop-after-init"
            ]

        print(f"Running command: {' '.join(cmd)}")
        result = subprocess.run(cmd, env=env, capture_output=True, text=True)
        print("STDOUT:")
        print(result.stdout)
        print("STDERR:")
        print(result.stderr)

        if result.returncode != 0:
            print(f"Odoo command failed with return code {result.returncode}")
            sys.exit(result.returncode)

        if not custom_modules_installed:
            print("Loading seed data...")
            seed_file = "/mnt/extra-addons/seed_data.py"
            if os.path.exists(seed_file):
                try:
                    with open(seed_file, "r", encoding="utf-8") as f:
                        seed_code = f.read()
                    
                    cmd_shell = [
                        "odoo",
                        "shell",
                        "-d", db_name,
                        "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/base_accounting_kit",
                        "--db_host=" + db_host,
                        "--db_port=5432",
                        "--db_user=" + db_user,
                        "--db_password=" + db_password,
                        "--no-http"
                    ]
                    print(f"Running shell command: {' '.join(cmd_shell)}")
                    result_shell = subprocess.run(cmd_shell, input=seed_code, text=True, env=env, capture_output=True)
                    print("SHELL STDOUT:")
                    print(result_shell.stdout)
                    print("SHELL STDERR:")
                    print(result_shell.stderr)
                    
                    if result_shell.returncode != 0:
                        print(f"Seed data execution failed with return code {result_shell.returncode}")
                        sys.exit(result_shell.returncode)
                    print("Seed data loaded successfully.")
                except Exception as e:
                    print(f"Failed to load seed data: {e}")
                    sys.exit(1)
            else:
                print(f"WARNING: Seed data script not found at {seed_file}")

        print("=== ClinicFlow Database Setup/Upgrade Complete ===")
        sys.exit(0)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Odoo filestore (attachments, sessions)
      - odoo-prod-data:/var/lib/odoo
    environment:
      - HOST=postgres_clinicflow
      - PORT=5432
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
      - ODOO_DB_HOST=postgres_clinicflow
      - ODOO_DB_PORT=5432
      - ODOO_DB_USER=odoo
      - ODOO_DB_PASSWORD=${DB_PASSWORD}
      - ODOO_ADMIN_PASSWD=${MASTER_PASSWORD}
      - ODOO_ADDONS_PATH=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/base_accounting_kit
      - ODOO_DATA_DIR=/var/lib/odoo
    networks:
      - clinicflow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # Odoo 19.0 CE (multi-arch — works on ARM64 + AMD64)
  # ----------------------------------------------------------
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinicflow-odoo-prod:latest
    container_name: odoo_clinicflow_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      odoo_init:
        condition: service_completed_successfully
    volumes:
      # Odoo filestore (attachments, sessions)
      - odoo-prod-data:/var/lib/odoo
    environment:
      - HOST=postgres_clinicflow
      - PORT=5432
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
      - ODOO_DB_HOST=postgres_clinicflow
      - ODOO_DB_PORT=5432
      - ODOO_DB_USER=odoo
      - ODOO_DB_PASSWORD=${DB_PASSWORD}
      - ODOO_ADMIN_PASSWD=${MASTER_PASSWORD}
      - ODOO_DBFILTER=^clinicflow$$
      - ODOO_PROXY_MODE=True
      - ODOO_WORKERS=2
      - ODOO_MAX_CRON_THREADS=1
      - ODOO_LIMIT_MEMORY_HARD=1677721600
      - ODOO_LIMIT_MEMORY_SOFT=629145600
      - ODOO_LIMIT_REQUEST=8192
      - ODOO_LIMIT_TIME_CPU=60
      - ODOO_LIMIT_TIME_REAL=120
      - ODOO_ADDONS_PATH=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/extra-addons/base_accounting_kit
      - ODOO_DATA_DIR=/var/lib/odoo
    # No ports exposed to host — CF Tunnel connects via internal network
    networks:
      - clinicflow-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------
  # PostgreSQL 15
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres_clinicflow
    restart: always
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=clinicflow
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - clinicflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  odoo-prod-data:
    name: odoo-clinicflow-prod-data
  postgres-prod-data:
    name: postgres-clinicflow-prod-data

# ----------------------------------------------------------
# Network (reused from the clinicflow-sam stack)
# ----------------------------------------------------------
networks:
  clinicflow-net:
    external: true
    name: clinicflow-sam_clinic-network
