# ============================================================
# ClinicFlow — Production Portainer Stack
# Deploy on: Oracle A1Flex VPS (ARM64) + Cloudflare Tunnel
# Target domain: demoerp.clinicflow.vet
#
# HOW TO USE (Portainer Git Stack):
#   1. In Portainer → Stacks → Add Stack
#   2. Select "Repository" and paste the GitHub URL
#   3. Set Compose path to "docker-compose.prod.yml"
#   4. Fill in the environment variables below
#   5. Enable Automatic Updates (optional)
#   6. Deploy
# ============================================================

services:

  # ----------------------------------------------------------
  # Odoo 19.0 CE (multi-arch — works on ARM64 + AMD64)
  # ----------------------------------------------------------
  odoo:
    image: odoo:19.0
    container_name: odoo_clinicflow_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Odoo filestore (attachments, sessions)
      - odoo-prod-data:/var/lib/odoo
      # Custom ClinicFlow addons (Portainer bind mounts the cloned repo root)
      - .:/mnt/extra-addons:ro
    environment:
      - HOST=postgres_clinicflow
      - PORT=5432
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
    command: >
      odoo 
      --db-filter=^clinicflow$$ 
      --proxy-mode 
      --workers=2 
      --max-cron-threads=1 
      --limit-memory-hard=1677721600 
      --limit-memory-soft=629145600 
      --limit-request=8192 
      --limit-time-cpu=60 
      --limit-time-real=120
      --admin-passwd=${MASTER_PASSWORD}
    # No ports exposed to host — CF Tunnel connects via internal network
    networks:
      - clinicflow-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------
  # PostgreSQL 15
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: postgres_clinicflow
    restart: always
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=clinicflow
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - clinicflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # Cloudflare Tunnel
  # Get your token from:
  #   Cloudflare Zero Trust → Networks → Tunnels
  #   → your tunnel → Configure → Docker
  # ----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_clinicflow
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - odoo
    networks:
      - clinicflow-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  odoo-prod-data:
    name: odoo-clinicflow-prod-data
  postgres-prod-data:
    name: postgres-clinicflow-prod-data

# ----------------------------------------------------------
# Network (internal — no host port exposure needed)
# ----------------------------------------------------------
networks:
  clinicflow-net:
    driver: bridge
    name: clinicflow-prod-net
